<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow - Modern To-Do List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions for item entry */
        .task-item {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .task-item.removing {
            opacity: 0;
            transform: translateX(30px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.6);
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300 antialiased selection:bg-brand-500 selection:text-white">

    <div class="min-h-full flex flex-col justify-between py-8 px-4 sm:px-6 lg:px-8">
        <!-- Main Container -->
        <main class="max-w-xl w-full mx-auto bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700/60 overflow-hidden flex flex-col my-auto transition-colors duration-300">
            
            <!-- Header Section -->
            <div class="p-6 sm:p-8 bg-gradient-to-r from-brand-600 via-indigo-600 to-purple-600 text-white relative">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="p-2.5 bg-white/10 backdrop-blur-md rounded-xl text-white">
                            <i class="fa-solid fa-check-double text-xl"></i>
                        </div>
                        <h1 class="text-2xl font-bold tracking-tight">TaskFlow</h1>
                    </div>
                    
                    <!-- Dark/Light Mode Toggle -->
                    <button id="themeToggle" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 backdrop-blur-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/50" aria-label="Toggle Theme">
                        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                    </button>
                </div>

                <!-- Progress Header -->
                <div class="mt-6">
                    <div class="flex justify-between items-center text-sm font-medium mb-2 opacity-90">
                        <span>Task Progress</span>
                        <span id="progressText">0 of 0 completed</span>
                    </div>
                    <div class="w-full h-2.5 bg-black/20 rounded-full overflow-hidden backdrop-blur-sm">
                        <div id="progressBar" class="h-full bg-white transition-all duration-500 ease-out rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-6 sm:p-8 border-b border-slate-100 dark:border-slate-700/60 bg-slate-50/50 dark:bg-slate-800/50">
                <form id="todoForm" class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <input type="text" id="taskInput" placeholder="What needs to be done?" required
                            class="w-full px-4 py-3.5 pl-11 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 text-sm shadow-sm"
                        />
                        <i class="fa-solid fa-plus absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    </div>
                    <button type="submit" 
                        class="px-6 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl shadow-md shadow-brand-500/20 active:scale-95 transition-all duration-200 flex items-center justify-center space-x-2 text-sm sm:w-auto w-full">
                        <span>Add Task</span>
                    </button>
                </form>
            </div>

            <!-- Filter & Action Controls -->
            <div class="px-6 py-4 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700/60 flex flex-wrap items-center justify-between gap-4">
                <!-- Status Filter Buttons -->
                <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl text-xs font-medium w-full sm:w-auto">
                    <button data-filter="all" class="filter-btn flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-150 active-filter bg-white dark:bg-slate-800 text-brand-600 dark:text-white shadow-xs">All</button>
                    <button data-filter="active" class="filter-btn flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-150">Active</button>
                    <button data-filter="completed" class="filter-btn flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-150">Completed</button>
                </div>

                <!-- Clear Button -->
                <button id="clearCompleted" class="text-xs font-medium text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition-colors duration-150 hidden">
                    Clear Completed
                </button>
            </div>

            <!-- Task List Container -->
            <div class="p-6 sm:p-8 flex-1 min-h-[250px] max-h-[420px] overflow-y-auto">
                <ul id="taskList" class="space-y-3">
                    <!-- Dynamic tasks will be inserted here -->
                </ul>

                <!-- Empty State -->
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center py-12 px-4">
                    <div class="w-16 h-16 mb-4 rounded-full bg-slate-100 dark:bg-slate-700/50 flex items-center justify-center text-slate-400 dark:text-slate-500 text-2xl">
                        <i class="fa-regular fa-clipboard"></i>
                    </div>
                    <h3 class="text-base font-semibold text-slate-700 dark:text-slate-300">No tasks found</h3>
                    <p class="text-sm text-slate-400 dark:text-slate-500 max-w-xs mt-1">Get started by typing a new task above!</p>
                </div>
            </div>

            <!-- Footer Stats -->
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
                <span id="itemsLeft">0 items remaining</span>
                <span>Saved locally</span>
            </div>
        </main>

        <!-- Footer Credits -->
        <footer class="mt-8 text-center text-xs text-slate-400 dark:text-slate-600">
            Created for software engineering portfolio • Ready for GitHub Pages
        </footer>
    </div>

    <!-- Application Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State Variables
            let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [];
            let currentFilter = 'all';

            // DOM Elements
            const todoForm = document.getElementById('todoForm');
            const taskInput = document.getElementById('taskInput');
            const taskList = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const clearCompletedBtn = document.getElementById('clearCompleted');
            const itemsLeftEl = document.getElementById('itemsLeft');
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // --- Theme Support ---
            const userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedTheme = localStorage.getItem('taskflow_theme');

            if (savedTheme === 'dark' || (!savedTheme && userPrefersDark)) {
                document.documentElement.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-lg';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-lg';
            }

            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                themeIcon.className = isDark ? 'fa-solid fa-sun text-lg' : 'fa-solid fa-moon text-lg';
                localStorage.setItem('taskflow_theme', isDark ? 'dark' : 'light');
            });

            // --- Save Data ---
            const saveTasks = () => {
                localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
                updateUI();
            };

            // --- Render App UI ---
            const updateUI = () => {
                // Filter items logic
                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });

                // Clear Task List Markup
                taskList.innerHTML = '';

                if (filteredTasks.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');

                    filteredTasks.forEach(task => {
                        const li = document.createElement('li');
                        li.className = `task-item group flex items-center justify-between p-4 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-700/60 rounded-xl hover:border-slate-200 dark:hover:border-slate-600 transition-all shadow-xs ${task.completed ? 'bg-slate-50/70 dark:bg-slate-900/40' : ''}`;
                        li.dataset.id = task.id;

                        li.innerHTML = `
                            <div class="flex items-center space-x-3.5 flex-1 min-w-0 pr-3 cursor-pointer" onclick="toggleTask('${task.id}')">
                                <button type="button" class="w-5 h-5 rounded-md border flex items-center justify-center transition-all duration-200 ${task.completed ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300 dark:border-slate-600 group-hover:border-brand-500'}">
                                    ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                </button>
                                <span class="text-sm font-medium truncate select-none transition-all duration-200 ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-200'}">
                                    ${escapeHtml(task.title)}
                                </span>
                            </div>
                            <button onclick="deleteTask('${task.id}')" aria-label="Delete Task" class="text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 p-1.5 rounded-lg opacity-100 sm:opacity-0 group-hover:opacity-100 transition-all duration-200">
                                <i class="fa-regular fa-trash-can text-sm"></i>
                            </button>
                        `;

                        taskList.appendChild(li);
                    });
                }

                // Stats calculation
                const total = tasks.length;
                const completedCount = tasks.filter(t => t.completed).length;
                const activeCount = total - completedCount;

                itemsLeftEl.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} remaining`;
                progressText.textContent = `${completedCount} of ${total} completed`;

                const percentage = total === 0 ? 0 : Math.round((completedCount / total) * 100);
                progressBar.style.width = `${percentage}%`;

                // Show/hide Clear Completed Button
                if (completedCount > 0) {
                    clearCompletedBtn.classList.remove('hidden');
                } else {
                    clearCompletedBtn.classList.add('hidden');
                }
            };

            // Escaping HTML to prevent XSS issues
            const escapeHtml = (str) => {
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            };

            // --- Add Task ---
            todoForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = taskInput.value.trim();
                if (!title) return;

                const newTask = {
                    id: Date.now().toString(),
                    title: title,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                tasks.unshift(newTask);
                saveTasks();
                taskInput.value = '';
            });

            // --- Toggle Completion ---
            window.toggleTask = (id) => {
                tasks = tasks.map(task => 
                    task.id === id ? { ...task, completed: !task.completed } : task
                );
                saveTasks();
            };

            // --- Delete Task ---
            window.deleteTask = (id) => {
                const itemEl = document.querySelector(`[data-id="${id}"]`);
                if (itemEl) {
                    itemEl.classList.add('removing');
                    setTimeout(() => {
                        tasks = tasks.filter(task => task.id !== id);
                        saveTasks();
                    }, 200);
                }
            };

            // --- Filter Switcher ---
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-white', 'dark:bg-slate-800', 'text-brand-600', 'dark:text-white', 'shadow-xs');
                        b.classList.add('text-slate-600', 'dark:text-slate-400');
                    });
                    btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-brand-600', 'dark:text-white', 'shadow-xs');
                    btn.classList.remove('text-slate-600', 'dark:text-slate-400');

                    currentFilter = btn.dataset.filter;
                    updateUI();
                });
            });

            // --- Clear All Completed ---
            clearCompletedBtn.addEventListener('click', () => {
                tasks = tasks.filter(t => !t.completed);
                saveTasks();
            });

            // Initial render
            updateUI();
        });
    </script>
</body>
</html>
